<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Text Reader Zer0</title>
</head>
<body>
    <header>
        <h1>Text Reader Zer0</h1>
    </header>
    <main>
        <button id="read" aria-label="Ler Texto">
            <i class="fa-solid fa-play"></i> Ler Texto
        </button>
        <button id="stop" aria-label="Parar Leitura">
            <i class="fa-solid fa-stop"></i> Parar
        </button>
        <div id="config-button" class="config">
            <button aria-label="Configurações">
                <i class="fa-solid fa-gear"></i> Configurações
            </button>
        </div>
    </main>
    <footer>
        <small>© 2024 Text Reader Zer0</small>
    </footer>
    <script src="popup.js"></script>
</body>
</html>
